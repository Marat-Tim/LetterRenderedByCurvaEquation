<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desmos Graphs</title>
    <script src="https://www.desmos.com/api/v1.8/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.2.2/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.2.2/core.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
        }

        #input-container {
            background-color: #f2f2f2;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        #input-container label {
            margin-right: 5px;
        }

        #text {
            width: 200px;
        }

        button#draw {
            margin-left: 0;
        }

        .note {
            flex-basis: 100%;
            font-size: 0.9em;
            color: #555;
        }


        #calculator {
            flex-grow: 1;
        }

        input[type="text"] {
            flex: 1;
            min-width: 150px;
        }

        dialog#loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90%;
            padding: 1em;
            z-index: 1000;
        }
    </style>

    <script type="module">
        const loading = document.getElementById('loading');
        window.addEventListener('py:ready', () => {
            loading.close();
            const params = new URLSearchParams(window.location.search);
            const text = params.get("text");
            if (text) {
                const input = document.getElementById("text");
                const button = document.getElementById("draw");
                input.value = text;
                setTimeout(() => button.click(), 1000);
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const elt = document.getElementById('calculator');
            window.desmosCalculator = Desmos.GraphingCalculator(elt);
        });

        loading.showModal();
    </script>
</head>
<body>

<dialog id="loading">
    <h1>Инициализируем pyscript, может занять какое-то время...</h1>
</dialog>

<div id="input-container">
    <label for="text">Введите текст:</label>
    <input id="text" type="text">
    <button id="draw" py-click="graph">Нарисовать</button>
    <span class="note">* pyscript может долго думать после загрузки(подождите 20-30 секунд)</span>
</div>

<div id="calculator"></div>

<script type="py" src="main.py" config="./config.json"></script>

</body>
</html>
