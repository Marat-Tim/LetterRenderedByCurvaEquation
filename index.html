<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desmos Graphs</title>
    <script src="https://www.desmos.com/api/v1.8/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.2.2/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.2.2/core.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #input-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: #f2f2f2;
            padding: 10px;
            box-sizing: border-box;
        }

        #calculator {
            position: absolute;
            top: 50px;
            left: 0;
            width: 100%;
            height: calc(100vh - 50px);
        }
    </style>

    <script type="module">
        const loading = document.getElementById('loading');
        window.addEventListener('py:ready', () => {
            loading.close()
        });
        window.addEventListener('DOMContentLoaded', () => {
            const elt = document.getElementById('calculator');
            window.desmosCalculator = Desmos.GraphingCalculator(elt);
        });
        loading.showModal();
    </script>
</head>
<body>

<dialog id="loading">
    <h1>Инициализируем pyscript, может занять какое-то время...</h1>
</dialog>

<div id="input-container">
    <label for="text">Введите текст:</label>
    <input id="text" type="text">
    <button id="draw" py-click="graph">Нарисовать</button>
    <span class="note">* Окно ввода может быть недоступно, пока загружается окружение</span>
</div>

<div id="calculator"></div>

<script type="py" src="main.py" config="./config.json"></script>

</body>
</html>
