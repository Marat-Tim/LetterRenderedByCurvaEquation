<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desmos Graphs</title>
    <script src="https://www.desmos.com/api/v1.8/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@15.2.0/lib/browser/math.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
        }

        #input-container {
            background-color: #f2f2f2;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        #input-container label {
            margin-right: 5px;
        }

        #text {
            width: 200px;
        }

        button#draw {
            margin-left: 0;
        }

        .note {
            flex-basis: 100%;
            font-size: 0.9em;
            color: #555;
        }


        #calculator {
            flex-grow: 1;
        }

        input[type="text"] {
            flex: 1;
            min-width: 150px;
        }
    </style>


</head>
<body>

<div id="input-container">
    <label for="text">Введите текст:</label>
    <input id="text" type="text">
    <button id="draw">Нарисовать</button>
</div>

<div id="calculator"></div>

<script type="module" src="main.js"></script>

</body>
</html>
